<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">มาตรฐานวิชาชีพครู — ปกตำรา</title>
  <desc id="desc">ภาพปกตำรามาตรฐานวิชาชีพครู</desc>
  <defs>
    <linearGradient id="bg" x1="104" y1="98" x2="760" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B5D8C"/>
      <stop offset="0.38" stop-color="#3E709D"/>
      <stop offset="1" stop-color="#7CA5C8"/>
    </linearGradient>
    <linearGradient id="page" x1="250" y1="160" x2="680" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6FBFF"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="900" height="1200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#163453" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#F5F6F7"/>
  <circle cx="730" cy="160" r="120" fill="#D8EAFF" fill-opacity="0.4"/>
  <circle cx="150" cy="1030" r="165" fill="#D8EAFF" fill-opacity="0.18"/>
  <g filter="url(#soft)">
    <rect x="170" y="110" width="560" height="980" rx="48" fill="url(#bg)"/>
    <rect x="230" y="180" width="440" height="840" rx="34" fill="url(#page)"/>
  </g>
  <!-- crest -->
  <rect x="370" y="230" width="160" height="18" rx="9" fill="#D7A35B"/>
  <circle cx="450" cy="290" r="52" fill="#EAF2FA" stroke="#2B5D8C" stroke-width="6"/>
  <path d="M450 255L465 305H435L450 255Z" fill="#2B5D8C"/>
  <rect x="418" y="308" width="64" height="10" rx="5" fill="#D7A35B"/>
  <!-- title block -->
  <text x="450" y="420" text-anchor="middle" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="2">ตำราออนไลน์</text>
  <text x="450" y="490" text-anchor="middle" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">มาตรฐานวิชาชีพครู</text>
  <text x="450" y="545" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">ฐานความรู้สำหรับ</text>
  <text x="450" y="585" text-anchor="middle" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">ครูมืออาชีพในศตวรรษที่ 21</text>
  <path d="M290 650H610" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  <text x="450" y="720" text-anchor="middle" fill="#2B5D8C" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600">Boorapatis Ploysuwan</text>
  <text x="450" y="760" text-anchor="middle" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">พ.ศ. 2567</text>
</svg>
